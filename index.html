<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Mini Museum - Hydro Power Plant</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    AFRAME.registerComponent('info-click', {
      init: function () {
        const el = this.el;
        el.addEventListener('click', () => {
          document.querySelector('#info').innerHTML =
            '<b>' + el.dataset.title + '</b><br>' + el.dataset.text;
        });
      }
    });

    AFRAME.registerComponent('spin', {
      schema: { speed: { default: 120 } },
      init: function () {
        this.boost = 1;
        this.el.addEventListener('click', () => {
          this.boost = (this.boost === 1) ? 3 : 1;
        });
      },
      tick: function (time, delta) {
        const degrees = this.data.speed * this.boost * (delta / 1000);
        this.el.object3D.rotation.z -= degrees * Math.PI / 180;
      }
    });

    AFRAME.registerComponent('marker-status', {
      init: function () {
        const banner = document.querySelector('#status');
        this.el.addEventListener('markerFound', () => {
          banner.textContent = 'Marker FOUND - tap a part of the power plant';
          banner.style.background = '#2E7D32';
        });
        this.el.addEventListener('markerLost', () => {
          banner.textContent = 'Marker LOST - point the camera at the Hiro marker';
          banner.style.background = '#C62828';
        });
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    #status {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      padding: 10px; text-align: center; color: white;
      font-family: sans-serif; background: #C62828;
      pointer-events: none;
    }
    #info {
      position: fixed; bottom: 10px; left: 10px; right: 10px; z-index: 999;
      padding: 12px; color: white; font-family: sans-serif; font-size: 15px;
      background: rgba(0, 0, 0, 0.7); border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status">Looking for marker...</div>
  <div id="info">Point the camera at the Hiro marker, then tap a part of the power plant to learn about it.</div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro" marker-status>

      <a-plane rotation="-90 0 0" width="1.6" height="1.6"
               color="#2C3E50"></a-plane>

      <a-text value="Hydro Power Plant" position="0 1.2 0" align="center"
              width="2.4" color="#FFFFFF"></a-text>

      <a-box class="clickable" info-click
             data-title="Reservoir"
             data-text="Water stored behind the dam holds potential energy. The higher the water level, the more energy it can release."
             position="-0.6 0.3 0" width="0.4" height="0.6" depth="1.2"
             material="color: #3498DB; opacity: 0.75; transparent: true"></a-box>
      <a-text value="Reservoir" position="-0.6 0.72 0" align="center"
              width="1.2" color="#FFFFFF"></a-text>

      <a-box class="clickable" info-click
             data-title="Dam"
             data-text="The dam blocks the river and raises the water level. This creates a height difference, called the head, that gives the water its power."
             position="-0.35 0.4 0" width="0.1" height="0.8" depth="1.2"
             color="#BDC3C7"></a-box>
      <a-text value="Dam" position="-0.35 0.92 0" align="center"
              width="1.2" color="#FFFFFF"></a-text>

      <a-cylinder class="clickable" info-click
                  data-title="Penstock"
                  data-text="A large pipe that carries water from the reservoir down to the turbine. The water speeds up as it flows through."
                  position="-0.05 0.2 0" rotation="0 0 90" radius="0.06" height="0.5"
                  material="color: #AAB7B8; opacity: 0.4; transparent: true"></a-cylinder>

      <a-sphere radius="0.04" color="#5DADE2" position="-0.3 0.2 0"
                animation="property: position; from: -0.3 0.2 0; to: 0.2 0.2 0;
                           dur: 1200; easing: linear; loop: true"></a-sphere>
      <a-sphere radius="0.04" color="#5DADE2" position="-0.3 0.2 0"
                animation="property: position; from: -0.3 0.2 0; to: 0.2 0.2 0;
                           dur: 1200; delay: 400; easing: linear; loop: true"></a-sphere>
      <a-sphere radius="0.04" color="#5DADE2" position="-0.3 0.2 0"
                animation="property: position; from: -0.3 0.2 0; to: 0.2 0.2 0;
                           dur: 1200; delay: 800; easing: linear; loop: true"></a-sphere>

      <a-entity class="clickable" spin="speed: 120" info-click
                data-title="Turbine"
                data-text="Fast-moving water pushes the blades and makes the turbine spin, turning water energy into spinning (mechanical) energy. Tap it again to change the spin speed."
                position="0.3 0.2 0">
        <a-cylinder rotation="90 0 0" radius="0.04" height="0.1" color="#7F8C8D"></a-cylinder>
        <a-box width="0.3" height="0.05" depth="0.04" rotation="0 0 0"   color="#F39C12"></a-box>
        <a-box width="0.3" height="0.05" depth="0.04" rotation="0 0 45"  color="#F39C12"></a-box>
        <a-box width="0.3" height="0.05" depth="0.04" rotation="0 0 90"  color="#F39C12"></a-box>
        <a-box width="0.3" height="0.05" depth="0.04" rotation="0 0 135" color="#F39C12"></a-box>
      </a-entity>
      <a-text value="Turbine" position="0.3 0.5 0" align="center"
              width="1.2" color="#FFFFFF"></a-text>

      <a-box class="clickable" info-click
             data-title="Generator"
             data-text="The spinning turbine drives the generator, which makes electricity using magnets and coils of wire. The power then travels to homes through power lines."
             position="0.62 0.15 0" width="0.24" height="0.3" depth="0.4"
             color="#C0392B"></a-box>
      <a-text value="Generator" position="0.62 0.88 0" align="center"
              width="1.2" color="#FFFFFF"></a-text>

      <a-sphere radius="0.05" color="#F1C40F" position="0.62 0.45 0"
                animation="property: position; from: 0.62 0.45 0; to: 0.62 0.7 0;
                           dir: alternate; dur: 600; easing: easeInOutSine; loop: true"></a-sphere>

    </a-marker>

    <a-entity camera
              cursor="rayOrigin: mouse"
              raycaster="objects: .clickable"></a-entity>
  </a-scene>
</body>
</html>
